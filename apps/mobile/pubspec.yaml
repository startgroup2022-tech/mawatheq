name: mawatheq_mobile
description: "مواثيق — التطبيق القانوني المتكامل (Flutter) / Mawatheq legal platform mobile app"
publish_to: 'none'
version: 1.6.1+16

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking — one centralised client. The app never touches the database.
  http: ^1.2.2
  http_parser: ^4.0.2

  # State management (lightweight, feature-scoped).
  provider: ^6.1.2

  # Secure token storage (Keychain / EncryptedSharedPreferences).
  flutter_secure_storage: ^9.2.2

  # Non-secret local preferences (locale, onboarding flag).
  shared_preferences: ^2.3.2

  # Arabic/Latin dates and number formatting.
  intl: ^0.20.2

  # Brand typography shared with the website (Cairo, IBM Plex Sans Arabic).
  google_fonts: ^6.2.1

  # Payment gateway page (documented N-Genius flow). Not used as app UI.
  webview_flutter: ^4.10.0

  # Opening external links (store pages, web fallbacks).
  url_launcher: ^6.3.0
  file_picker: ^11.0.3
  app_links: ^6.4.1

  # Camera capture and gallery selection for consultation attachments. The
  # attachment endpoint already accepts png/jpg/jpeg, so a photo of a contract is
  # a first-class submission rather than a document the customer must scan first.
  image_picker: ^1.2.4

  # Voice notes. `record` is the recorder; it writes an m4a (AAC) file, which the
  # attachment endpoint already accepts. Playback is deliberately not a dependency:
  # the customer reviews the length and removes the note if it is wrong, and the
  # lawyer plays it on the web console.
  record: ^7.1.2
  # The recorder needs a writable path for the file it is producing.
  path_provider: ^2.1.5

  # Runtime permission prompts. Android 13+ splits the notification permission out
  # of the manifest, and the recorder/camera need a granted permission before the
  # plugin is called, otherwise the platform throws instead of prompting.
  permission_handler: ^13.0.2

  # Appointment reminders, scheduled locally on the device. There is no server
  # reminder endpoint, so the reminder is derived from the booking the customer
  # just made and never claims the server sent it.
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_webrtc: ^1.6.2+hotfix.4
  jitsi_meet_flutter_sdk: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # `assets/images/` is not recursive, so the banner photos need their own entry.
    # Without it `Image.asset` throws at first paint and every built-in slide falls
    # back to its gradient — a slider of four flat panels.
    - assets/images/banners/
    # The Arabic type families are bundled rather than fetched at runtime. The app
    # has to render Arabic correctly on a first launch with no network, and a
    # runtime download of a font is a visible reflow at best and a fallback face at
    # worst. Names carry the exact family+weight that `google_fonts` resolves to, so
    # it loads these instead of reaching for fonts.gstatic.com.
    - assets/fonts/
